name: CSIRT Automated Triage Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Enforce Node.js 24 runtime for all JavaScript-based GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-incident-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Node 24 Native)
        uses: actions/checkout@v7

      - name: Set up Node.js 24 Runtime
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Python (Node 24 Native)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify Node.js 24 & Python Runtimes
        run: |
          node --version
          python3 --version

      - name: Execute CSIRT Telemetry Triage Engine
        run: python3 src/triage_engine.py

      - name: Commit Auto-Generated Triage Report to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/automated_triage_output.md
          git diff --staged --quiet || git commit -m "chore(ir): auto-generate triage timeline and defanged IOC report [skip ci]"
          git push
